name: CI - Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --group dev --group test
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run pyrefly check
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      COVERAGE_CORE: ctrace
      JAX_COMPILATION_CACHE_DIR: /tmp/jax_cache
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --no-default-groups --group test --python ${{ matrix.python-version }}

      # Testmon cache
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .testmondata
          key: testmon-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            testmon-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-

      # JAX compilation cache
      - uses: actions/cache/restore@v6.1.0
        with:
          path: /tmp/jax_cache
          key: jax-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            jax-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-

      - name: Selective tests (testmon)
        id: selective
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        continue-on-error: true
        run: uv run pytest --testmon

      - name: Full tests
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || steps.selective.outcome == 'failure'
        run: rm .testmondata & uv run pytest --testmon

      # Save caches (main only)
      - name: Save Testmon cache
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6.1.0
        with:
          path: .testmondata
          key: testmon-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}

      - name: Save JAX compilation cache
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: /tmp/jax_cache
          key: jax-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
