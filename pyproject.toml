[project]
name = "ainmax"
version = "0.0.1"
description = "Scientific computing in JAX with named arrays"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name="Christopher Kirwan", email="christopher.kirwan@ibm.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python"
]
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.12.0.1",
]

[project.optional-dependencies]
gpu = ["jax[cuda13]"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
include = ["ainmax/*"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "rich>=15.0.0",
    "ruff>=0.17.3",
    "matplotlib>=3.11.2",
    "pyqt6>=6.12.0",
    "pyrefly>=1.4.0",
]
docs = ["zensical>=0.0.74", "ipykernel>=7.4.0",]
plot = ["matplotlib>=3.11.2", "pyqt6>=6.12.0"]
test = [
    "beartype>=0.22.9",
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    "pytest-testmon>=2.2.0",
]

[tool.pytest_env]
JAX_ENABLE_X64 = "True"
JAX_PLATFORMS = {value = "cpu", "skip_if_set" = true}

[tool.ruff]
line-length = 119
extend-include = ["*.ipynb"]
src = []

[tool.ruff.lint]
fixable = ["I001", "F401"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
select = ["E", "F", "I001"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
order-by-type = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.pyrefly]
project-excludes = [
    "tests/**"
]
